        function handleLogin() {
            const btn = document.getElementById('loginBtn');
            
            const lastClick = localStorage.getItem('last_login_attempt_time');
            const cooldownPeriod = 15000;

            if (lastClick && (Date.now() - parseInt(lastClick) < cooldownPeriod)) {
                const secondsLeft = Math.ceil((cooldownPeriod - (Date.now() - parseInt(lastClick))) / 1000);
                showError(btn, `انتظر ${secondsLeft} ثانية قبل المحاولة ⏳`);
                return; 
            }

            if (btn.disabled) return; 
            btn.disabled = true; 

            if (!database) {
                showError(btn, "يوجد مشكلة في الاتصال! يرجى تحديث الصفحة.");
                return;
            }

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if(usernameInput === '' || passwordInput === '') { 
                showError(btn, 'يرجى إدخال البيانات!'); 
                return; 
            }

            localStorage.setItem('last_login_attempt_time', Date.now());

            btn.style.background = 'rgba(26,43,85,.8)'; btn.style.color = '#fff'; btn.innerHTML = 'جاري التحقق...';

            database.ref('credentials/' + usernameInput).once('value').then((snapshot) => {
                const userData = snapshot.val();
                if (userData && String(userData.password) === passwordInput) {
                    localStorage.setItem('saved_username_v2', usernameInput);
                    localStorage.setItem('saved_password_v2', passwordInput);
                    
                    verifyConnectionAndLogin(usernameInput);
                } else { 
                    showError(btn, 'البيانات غير صحيحة!'); 
                }
            }).catch((err) => { 
                showError(btn, 'فشل الاتصال! تأكد من جودة الإنترنت.'); 
            });
        }

        function fetchExamsFromServer() {
            const examsContainer = document.getElementById('dynamicExamsList');
            
            if (!database) {
                examsContainer.innerHTML = '<p style="color:var(--bad); text-align:center; font-size:14px; padding:20px;">مشكلة في الاتصال بالخادم. يرجى التحديث.</p>';
                return;
            }

            database.ref('exams').on('value', (snapshot) => {
                examsContainer.innerHTML = ''; 
                const examsData = snapshot.val();
                
                if (examsData) {
                    Object.keys(examsData).forEach((key) => {
                        const exam = examsData[key];
                        if(exam && exam.name) {
                            const isClosed = exam.status === 'closed';
                            const actionClass = isClosed ? 'locked' : '';
                            const actionText = isClosed ? 'مغلق 🔒' : 'دخول';

                            examsContainer.innerHTML += `
                                <div class="exam-item" onclick="goToExam('${isClosed}', '${exam.url}')">
                                    <div class="exam-info">
                                        <span class="exam-name">${exam.name}</span>
                                        <span class="exam-meta">${exam.questionsCount} سؤال</span>
                                    </div>
                                    <div class="exam-status ${actionClass}">${actionText}</div>
                                </div>`;
                        }
                    });
                } else {
                    examsContainer.innerHTML = '<p style="color:var(--muted); text-align:center; font-size:14px; padding:20px;">لا توجد اختبارات متاحة حالياً.</p>';
                }
            }, (error) => {
                examsContainer.innerHTML = '<p style="color:var(--bad); text-align:center; font-size:14px; padding:20px;">تعذر الاتصال بالخادم. تأكد من جودة الإنترنت.</p>';
            });
        }

        function fetchPdfsFromServer() {
            const pdfsContainer = document.getElementById('dynamicPdfsList');
            if (!database) return;

            database.ref('pdfs').on('value', (snapshot) => {
                pdfsContainer.innerHTML = ''; 
                const pdfsData = snapshot.val();
                
                if (pdfsData) {
                    Object.keys(pdfsData).forEach((key) => {
                        const pdf = pdfsData[key];
                        if(pdf && pdf.name) {
                            pdfsContainer.innerHTML += `
                                <div class="exam-item" onclick="openPdfModal('${pdf.url}')">
                                    <div class="exam-info">
                                        <span class="exam-name">${pdf.name}</span>
                                        <span class="exam-meta">${pdf.size || 'ملف مقروء'}</span>
                                    </div>
                                    <div class="pdf-status">فتح 📖</div>
                                </div>`;
                        }
                    });
                } else {
                    pdfsContainer.innerHTML = '<p style="color:var(--muted); text-align:center; font-size:14px; padding:20px;">لا توجد ملفات PDF متاحة حالياً.</p>';
                }
            });
        }

        function openPdfModal(url) {
            let finalUrl = url;
            if(url.includes('drive.google.com') && url.includes('/view')) {
                finalUrl = url.replace(/\/view.*/, '/preview');
            }
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(7,9,18,0.92); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity:0; transition: opacity 0.3s ease;';
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = 'إغلاق الملف ❌';
            closeBtn.style.cssText = 'margin-bottom:15px; padding:12px 25px; border-radius:12px; background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.4); font-weight:900; cursor:pointer; font-family:Tajawal, sans-serif; font-size:15px; box-shadow: 0 4px 15px rgba(239,68,68,0.2);';
            
            closeBtn.onclick = () => {
                modal.style.opacity = '0';
                setTimeout(() => document.body.removeChild(modal), 300);
            };
            
            const iframe = document.createElement('iframe');
            iframe.src = finalUrl;
            iframe.style.cssText = 'width:100%; max-width:600px; height:80%; border:1px solid rgba(110,231,255,0.3); border-radius:16px; background:#fff; box-shadow: 0 10px 40px rgba(0,0,0,0.6);';
            
            modal.appendChild(closeBtn);
            modal.appendChild(iframe);
            document.body.appendChild(modal);

            setTimeout(() => modal.style.opacity = '1', 10);
        }

        function goToExam(isClosed, url) {
            if (isClosed === 'true' || isClosed === true) {
                alert('عذراً، هذا الاختبار مغلق حالياً 🔒');
            } else {
                if (!database) return;
                
                const isAuth = sessionStorage.getItem('student_auth') === 'verified';
                const studentName = sessionStorage.getItem('student_name');
                
                if (!isAuth || !studentName) {
                    alert("يبدو أن الجلسة غير صالحة، يرجى تسجيل الدخول من جديد.");
                    handleLogout();
                    return;
                }

                showSmartAlert('جاري تأمين الجلسة وفتح الاختبار... ⏳');

                const secureToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
                
                database.ref('active_tickets/' + studentName).set({
                    token: secureToken,
                    timestamp: Date.now()
                }).then(() => {
                    const separator = url.includes('?') ? '&' : '?';
                    const secureUrl = `${url}${separator}u=${encodeURIComponent(studentName)}&t=${secureToken}`;
                    
                    window.location.href = secureUrl; 
                }).catch(() => {
                    alert('خطأ في الاتصال، يرجى المحاولة مجدداً.');
                });
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('student_auth');
            sessionStorage.removeItem('student_name');
            sessionStorage.removeItem('login_time');
            
            let keysToRemove = [];
            for(let i = 0; i < sessionStorage.length; i++) {
                let key = sessionStorage.key(i);
                if(key && key.startsWith('exam_session_')) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(k => sessionStorage.removeItem(k));

            clearTimeout(logoutTimer); 
            
            const savedUser = localStorage.getItem('saved_username_v2');
            const savedPass = localStorage.getItem('saved_password_v2');
            if(savedUser && savedPass) {
                document.getElementById('username').value = savedUser;
                document.getElementById('password').value = savedPass;
            } else {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
            
            const btn = document.getElementById('loginBtn');
            btn.style.background = 'linear-gradient(90deg, var(--glow1), var(--glow2))';
            btn.style.color = 'var(--bg0)';
            btn.innerHTML = 'تسجيل الدخول';
            btn.disabled = false; 

            document.getElementById('examsSection').style.display = 'none';
            document.getElementById('headerSubtitle').style.display = 'block';
            document.getElementById('loginSection').style.display = 'block';

            switchTab('exams');

            if (location.hash === '#exams') history.back();
        }

        window.addEventListener('popstate', function(event) {
            if (document.getElementById('examsSection').style.display === 'block') {
                if(sessionStorage.getItem('student_auth') === 'verified') {
                    history.pushState({page: 'exams'}, 'Exams', '#exams');

                    alert("انتهت صلاحية الجلسة. يرجى تسجيل الدخول مجدداً.");
                    handleLogout();
                }
            }
        });
