<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070912">
    
    <title>Platform Closed</title>
    
    <!-- خطوط جوجل الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg0: #070912; 
            --bg1: #0b1020; 
            --stroke: #1a2b55; 
            --text: #e9efff; 
            --muted: #a8b3d9; 
            --glow1: #6ee7ff; 
            --glow2: #a78bfa; 
            --glow3: #22c55e; 
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Outfit', 'Tajawal', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,.22), transparent 60%), 
                        radial-gradient(1000px 500px at 10% 0%, rgba(110,231,255,.18), transparent 55%), 
                        radial-gradient(900px 500px at 50% 120%, rgba(34,197,94,.12), transparent 60%), 
                        linear-gradient(180deg, var(--bg0), var(--bg1)); 
            color: var(--text); 
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px; 
            overflow-x: hidden; 
        }
        
        .app-container { 
            width: 100%; 
            max-width: 420px; 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 5px; 
        }
        
        .premium-logo { 
            position: relative; 
            width: 85px; 
            height: 85px; 
            margin: 0 auto 15px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #16203a, #0b1020); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,255,255,0.05); 
        }
        
        .premium-logo::before, .premium-logo::after { 
            content: ''; 
            position: absolute; 
            inset: -3px; 
            border-radius: 50%; 
            background: conic-gradient(from 0deg, var(--glow1), var(--glow2), var(--glow3), var(--glow1)); 
            z-index: -1; 
            animation: spin 4s linear infinite; 
        }
        
        .premium-logo::after { 
            filter: blur(12px); 
            opacity: 0.8; 
        }
        
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        
        .premium-logo svg { 
            width: 42px; 
            height: 42px; 
            filter: drop-shadow(0 0 8px rgba(110,231,255,0.8)); 
        }
        
        .header h1 { 
            font-size: 28px; 
            font-weight: 900; 
            margin-bottom: 5px; 
            text-shadow: 0 2px 10px rgba(110,231,255,0.3); 
            letter-spacing: 1px;
        }
        
        .header p { 
            color: var(--muted); 
            font-size: 15px; 
            font-weight: 500; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .card { 
            background: linear-gradient(180deg, rgba(15,23,48,.72), rgba(15,23,48,.45)); 
            border: 1px solid rgba(26,43,85,.85); 
            border-radius: 24px; 
            padding: 40px 20px; 
            box-shadow: 0 12px 30px rgba(0,0,0,.3), inset 0 0 0 1px rgba(110,231,255,.04); 
            position: relative; 
            overflow: hidden; 
            width: 100%; 
            text-align: center;
        }

        .icon-container {
            margin-bottom: 25px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: rgba(26,43,85,0.5);
            border: 1px solid rgba(110,231,255,0.2);
            box-shadow: 0 0 20px rgba(110,231,255,0.1);
            animation: float 3s ease-in-out infinite;
        }

        .icon-container svg {
            color: var(--glow1);
            filter: drop-shadow(0 0 8px rgba(110,231,255,0.6));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .card h2 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .card p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-family: 'Tajawal', sans-serif;
            direction: rtl; /* عشان لو عايز تضيف عربي مع الإنجليزي يكون مضبوط */
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(110,231,255,0.1);
            border: 1px solid rgba(110,231,255,0.3);
            padding: 10px 20px;
            border-radius: 99px;
            color: var(--glow1);
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--glow1);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--glow1);
            animation: pulse-dot 1.5s infinite alternate;
        }

        @keyframes pulse-dot {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .footer { 
            text-align: center; 
            margin-top: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
        }
        
        .glass-box { 
            background: rgba(15,23,48,.65); 
            border: 1px solid rgba(26,43,85,.85); 
            border-radius: 20px; 
            padding: 12px 26px; 
            box-shadow: 0 12px 30px rgba(0,0,0,.3), inset 0 0 0 1px rgba(110,231,255,.05); 
            backdrop-filter: blur(12px); 
            text-decoration: none; 
            transition: 0.3s; 
            display: inline-block; 
        }
        
        .neon { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(90deg, var(--glow1), var(--glow2), var(--glow3), var(--glow1)); 
            background-size: 200% 100%; 
            -webkit-background-clip: text; 
            color: transparent; 
            animation: flow 3s linear infinite; 
            font-weight: 900; 
            font-size: 14px; 
            letter-spacing: 1px; 
        }
        
        @keyframes flow { 
            0% { background-position: 0% 50%; } 
            100% { background-position: 200% 50%; } 
        }
        
        .fade-in { animation: appFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes appFadeIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الهيدر -->
        <div class="header fade-in">
            <div class="premium-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6ee7ff" />
                            <stop offset="100%" stop-color="#a78bfa" />
                        </linearGradient>
                    </defs>
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h1>EXAMS PLATFORM</h1>
            <p>Student Portal</p>
        </div>
        
        <!-- كارت الإغلاق المؤقت -->
        <div class="card fade-in" style="animation-delay: 0.1s;">
            <div class="icon-container">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            
            <h2>TEMPORARILY CLOSED</h2>
            
            <!-- الرسالة -->
            <p style="direction: ltr;">
                We are currently performing scheduled maintenance to upgrade our platform.<br>
                Thank you for your patience.
            </p>
            
            <!-- زر حالة لامع -->
            <div class="status-badge">
                <div class="pulse-dot"></div>
                WE'LL BE BACK SOON
            </div>
        </div>
        
        <!-- الفوتر -->
        <div class="footer fade-in" style="animation-delay: 0.2s;">
            <a href="https://wa.me/201016781843" target="_blank" class="glass-box">
                <span class="neon">DEVELOPED BY AHMED HAMED</span>
            </a>
        </div>
    </div>

</body>
</html>
