<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070912">
    <title>503 Service Unavailable - Exam Platform</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg0: #070912; 
            --bg1: #0b1020; 
            --stroke: #1a2b55; 
            --text: #e9efff; 
            --muted: #a8b3d9; 
            --glow1: #6ee7ff; 
            --glow2: #a78bfa; 
            --glow3: #22c55e; 
            --glow4: #fb7185; 
            --error: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(1200px 600px at 80% -10%, rgba(239,68,68,.10), transparent 60%), 
                        radial-gradient(1000px 500px at 10% 0%, rgba(110,231,255,.10), transparent 55%), 
                        linear-gradient(180deg, var(--bg0), var(--bg1)); 
            color: var(--text); 
            padding: 20px; 
            overflow: hidden; 
        }
        
        .maintenance-card {
            background: linear-gradient(180deg, rgba(15,23,48,.85), rgba(15,23,48,.55));
            border: 1px solid rgba(239,68,68,.3);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(239,68,68,.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes floatUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .icon-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(11,16,32,.8));
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(239,68,68,0.3);
        }

        .icon-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--error), transparent, var(--error));
            z-index: -1;
            animation: spin 3s linear infinite;
            filter: blur(10px);
            opacity: 0.5;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .icon-container svg {
            width: 45px;
            height: 45px;
            color: var(--error);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--error)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 15px var(--error)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--error)); }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 2px 15px rgba(239,68,68,0.4);
            color: var(--error);
        }

        .error-code {
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p {
            color: var(--text);
            font-size: 17px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .loading-bar {
            width: 100%;
            height: 6px;
            background: rgba(26,43,85,.6);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, var(--error), transparent);
            animation: loadingSweep 2s ease-in-out infinite;
        }

        @keyframes loadingSweep {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        .contact-btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: rgba(7,9,18,.6);
            border: 1px solid rgba(110,231,255,.3);
            color: var(--glow1);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.3s;
        }

        .contact-btn:hover {
            background: rgba(110,231,255,.1);
            border-color: rgba(110,231,255,.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(110,231,255,.1);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
        }

        .neon-text {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(90deg, var(--glow1), var(--glow2), var(--glow4), var(--glow1));
            background-size: 200% auto;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1.5px;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-container">
            <!-- أيقونة تحذير السيرفر -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        
        <h1>SERVER IS CURRENTLY DOWN</h1>
        <div class="error-code">Error 503 - Service Unavailable</div>
        
        <p>We are experiencing unexpected server issues or undergoing scheduled maintenance. Please try again later.</p>
        
        <div class="loading-bar"></div>
        


    <div class="footer">
        
</body>
</html>
