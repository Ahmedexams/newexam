    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,.22), transparent 60%), radial-gradient(1000px 500px at 10% 0%, rgba(110,231,255,.18), transparent 55%), radial-gradient(900px 500px at 50% 120%, rgba(34,197,94,.12), transparent 60%), linear-gradient(180deg, var(--bg0), var(--bg1)); color: var(--text); padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px; overflow-x: hidden; }
        
        .app-container { width: 100%; max-width: 420px; z-index: 10; display: flex; flex-direction: column; gap: 20px; }
        
        .header { text-align: center; margin-bottom: 10px; }
        .premium-logo { position: relative; width: 85px; height: 85px; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: linear-gradient(135deg, #16203a, #0b1020); box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,255,255,0.05); cursor: pointer; -webkit-tap-highlight-color: transparent;}
        .premium-logo::before, .premium-logo::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 0deg, var(--glow1), var(--glow2), var(--glow3), var(--glow1)); z-index: -1; animation: spin 4s linear infinite; }
        .premium-logo::after { filter: blur(12px); opacity: 0.8; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .premium-logo svg { width: 42px; height: 42px; filter: drop-shadow(0 0 8px rgba(110,231,255,0.8)); }
        
        .header h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(110,231,255,0.3); }
        .header p { color: var(--muted); font-size: 15px; font-weight: 800; }
        
        .card { background: linear-gradient(180deg, rgba(15,23,48,.72), rgba(15,23,48,.45)); border: 1px solid rgba(26,43,85,.85); border-radius: 24px; padding: 30px 20px; box-shadow: 0 12px 30px rgba(0,0,0,.3), inset 0 0 0 1px rgba(110,231,255,.04); position: relative; overflow: hidden; width: 100%; }
        .input-group { margin-bottom: 15px; position: relative; z-index: 2;}
        .input-group input { width: 100%; border-radius: 16px; border: 1px solid rgba(26,43,85,.85); background: rgba(7,9,18,.45); padding: 16px 18px; color: var(--text); font-size: 16px; font-weight: 800; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: rgba(110,231,255,.40); box-shadow: 0 0 15px rgba(110,231,255,.1), inset 0 0 0 1px rgba(110,231,255,.1); }
        .input-group input::placeholder { color: #5a6b9c; font-weight: 500; }
        
        .btn-primary { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(90deg, var(--glow1), var(--glow2)); color: var(--bg0); font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; margin-top: 10px; position: relative; z-index: 2; box-shadow: 0 0 20px rgba(110,231,255,.2); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .btn-secondary { width: 100%; padding: 14px; border: 1px solid rgba(110,231,255,.3); border-radius: 16px; background: rgba(7,9,18,.6); color: var(--glow1); font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; position: relative; z-index: 2; }
        .btn-secondary:active { transform: scale(0.97); }
        .btn-secondary:hover { background: rgba(110,231,255,.1); border-color: rgba(110,231,255,.6); }
        .btn-secondary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; color: var(--muted); border-color: rgba(26,43,85,.85); }

        .exams-header-row { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; position: relative; z-index: 2;}
        
        .logout-btn { background: rgba(239,68,68,.15); color: var(--bad); border: 1px solid rgba(239,68,68,.4); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; height: 100%; }
        .logout-btn:active { background: rgba(239,68,68,.3); transform: scale(0.95); }
        
        .tabs-row { display: flex; gap: 10px; margin-bottom: 15px; position: relative; z-index: 2; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(26,43,85,.85); background: rgba(7,9,18,.45); color: var(--muted); font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(90deg, rgba(110,231,255,.15), rgba(167,139,250,.15)); color: var(--text); border-color: rgba(110,231,255,.4); }
        
        .exams-list { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2;}
        
        .exam-item { border-radius: 16px; border: 1px solid rgba(26,43,85,.85); background: rgba(7,9,18,.35); padding: 18px; display: flex; justify-content: space-between; align-items: center; transition: transform .1s ease, border-color .2s ease, background .2s ease; cursor: pointer; }
        .exam-item:hover, .exam-item:active { transform: translateY(-2px); border-color: rgba(110,231,255,.30); background: rgba(7,9,18,.6);}
        
        .exam-info { display: flex; flex-direction: column; gap: 6px; }
        .exam-name { font-weight: 900; color: var(--text); font-size: 16px; }
        .exam-meta { color: var(--muted); font-size: 13px; font-weight: 800; }
        .exam-status { background: rgba(34,197,94,.15); color: var(--good); border: 1px solid rgba(34,197,94,.4); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 900; }
        .exam-status.locked { background: rgba(239,68,68,.12); color: var(--bad); border-color: rgba(239,68,68,.4); }
        
        .pdf-status { background: rgba(110,231,255,.15); color: var(--glow1); border: 1px solid rgba(110,231,255,.4); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 900; }

        .footer { text-align: center; margin-top: 30px; display: flex; justify-content: center; align-items: center; width: 100%; }
        .glass-box { background: rgba(15,23,48,.65); border: 1px solid rgba(26,43,85,.85); border-radius: 20px; padding: 12px 26px; box-shadow: 0 12px 30px rgba(0,0,0,.3), inset 0 0 0 1px rgba(110,231,255,.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); text-decoration: none; transition: 0.3s; display: inline-block; }
        .glass-box:hover { border-color: rgba(110,231,255,.3); transform: translateY(-3px); }
        .neon { font-family: 'Outfit', sans-serif; background: linear-gradient(90deg, var(--glow1), var(--glow2), var(--glow3), var(--glow4), var(--glow1)); background-size: 220% 100%; -webkit-background-clip: text; background-clip:text; color:transparent; animation: flow 4s linear infinite; font-weight: 900; font-size: 15px; letter-spacing: 0.6px; text-transform: uppercase; }
        @keyframes flow { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
        
        .fade-in { animation: appFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes appFadeIn { from { transform: translateY(15px); } to { transform: translateY(0); } }

        #adminDashboard { position: fixed; inset: 0; background: rgba(7,9,18,0.95); z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); opacity: 0; transition: 0.3s; }
        .dash-card { background: linear-gradient(180deg, rgba(15,23,48,.9), rgba(15,23,48,.6)); border: 1px solid rgba(110,231,255,.3); border-radius: 30px; padding: 40px; text-align: center; box-shadow: 0 0 50px rgba(110,231,255,.1); width: 90%; max-width: 350px; }
        .live-pulse { width: 15px; height: 15px; background: #22c55e; border-radius: 50%; margin: 0 auto 20px; box-shadow: 0 0 15px #22c55e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .online-count { font-size: 80px; font-weight: 900; font-family: 'Outfit', sans-serif; background: linear-gradient(90deg, var(--glow1), var(--glow3)); -webkit-background-clip: text; color: transparent; line-height: 1; margin: 10px 0; }
        .close-dash { margin-top: 30px; background: rgba(239,68,68,.15); color: var(--bad); border: 1px solid rgba(239,68,68,.4); padding: 12px 30px; border-radius: 16px; font-weight: 900; cursor: pointer; font-size: 16px; }
        
        .smart-toast { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); background: rgba(15,23,48,0.95); border: 1px solid rgba(239,68,68,0.6); box-shadow: 0 15px 40px rgba(239,68,68,0.3), inset 0 0 0 1px rgba(239,68,68,0.2); color: #fff; padding: 18px 24px; border-radius: 99px; z-index: 999999; display: flex; align-items: center; justify-content: center; text-align: center; gap: 12px; font-weight: 900; font-size: 14px; transition: top 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 90%; max-width: 380px; }
        .smart-toast.show { top: 30px; }

        /* شاشة الحظر الإجبارية */
        #kickOverlay { display: none; position: fixed; inset: 0; background: rgba(7,9,18,0.98); z-index: 9999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .kick-card { background: var(--bg1); border: 2px solid var(--bad); padding: 40px 30px; border-radius: 24px; box-shadow: 0 0 50px rgba(239,68,68,0.2); width: 90%; max-width: 400px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>

                </div>
                <div class="tabs-row">
                    <button class="tab-btn active" id="tabExamsBtn" onclick="switchTab('exams')">📝 الاختبارات</button>
                    <button class="tab-btn" id="tabPdfsBtn" onclick="switchTab('pdfs')">📚 ملفات PDF</button>
                </div>
                <div class="exams-list" id="dynamicExamsList"><p style="color:var(--muted); text-align:center; font-size:14px;">جاري تحميل الاختبارات...</p></div>
                <div class="exams-list" id="dynamicPdfsList" style="display: none;"><p style="color:var(--muted); text-align:center; font-size:14px;">جاري تحميل الملفات...</p></div>
            </div>
        </div>
        
        <div class="footer fade-in">
            <a href="https://wa.me/201016781843" target="_blank" class="glass-box"><span class="neon">DEVELOPED BY AHMED HAMED</span></a>
        </div>
    </div>

    <script>
    (function() {
        // 1. Anti-Debugging
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 67 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) { 
                return false; 
            }
        };
        setInterval(function() { 
            console.clear(); 
            console.log("%c🛑 منطقة محظورة!", "color: red; font-size: 30px; font-weight: bold;"); 
        }, 1000);
        
        let devtools = function() {};
        devtools.toString = function() {
            if(window.location.hostname !== 'localhost') {
                setInterval(function() { Function("debugger")(); }, 150);
            }
            return '';
        };
        console.log('%c', devtools);
        document.addEventListener('copy', function(e) { 
            if (!localStorage.getItem('account_generated_v2')) e.preventDefault(); 
        });

        // 2. Base64 Encoded Keys 
        const fbKeys = {
            k: atob("QUl6YVN5Q2VYYkpIaEhaclZWcS1CcHJiZVNBZ3hMYkI3bDM2RXFn"),
            d: atob("YWhtZWRleGFtcy0zZTI2Ny5maXJlYmFzZWFwcC5jb20="),
            u: atob("aHR0cHM6Ly9haG1lZGV4YW1zLTNlMjY3LWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
            p: atob("YWhtZWRleGFtcy0zZTI2Nw==")
        };
        const firebaseConfig = { 
            apiKey: fbKeys.k, authDomain: fbKeys.d, databaseURL: fbKeys.u, projectId: fbKeys.p, 
            storageBucket: "ahmedexams-3e267.firebasestorage.app", messagingSenderId: "151411096023", appId: "1:151411096023:web:fcabb7c60c6e433b1bf392" 
        };

        const tgKeys = {
            p1: atob("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA=="), p2: atob("ODkyNTYyMDU5NDo="), p3: atob("QUFHNDVXZDhnUzYyTUlfSkFlU1BtNTBhU2tMTFR4eldXMGc="), p4: atob("L3NlbmRNZXNzYWdl"), cid: atob("ODQ0NjUwMDk3OA==")
        };
        const getTeleUrl = () => tgKeys.p1 + tgKeys.p2 + tgKeys.p3 + tgKeys.p4;

        // 3. App Variables
        let database = null;
        let logoutTimer;
        let adminListener = null;

        window.sessionListenerRef = null;
        window.sessionListenerCallback = null;
        window.isKickedOut = false;

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                const sessionRef = database.ref('active_visitors').push();
                const connectedRef = database.ref('.info/connected');
                connectedRef.on('value', function(snap) {
                    if (snap.val() === true) { 
                        sessionRef.onDisconnect().remove(); 
                        sessionRef.set(true); 
                    }
                });
            }
        } catch(e) { console.error("Firebase Error"); }

        function monitorSession(username) {
            const localToken = sessionStorage.getItem('session_token');
            if (!localToken || !database) return;

            if (window.sessionListenerRef && window.sessionListenerCallback) {
                window.sessionListenerRef.off('value', window.sessionListenerCallback);
            }

            window.sessionListenerRef = database.ref('active_tickets/sessions/' + username);
            window.sessionListenerCallback = window.sessionListenerRef.on('value', function(snap) {
                const remoteToken = snap.val();
                
                if (remoteToken && remoteToken !== localToken) {
                    window.isKickedOut = true;
                    document.getElementById('kickOverlay').style.display = 'flex'; 
                    
                    setTimeout(() => {
                        document.getElementById('kickOverlay').style.display = 'none';
                        window.handleLogout();
                    }, 3500);
                }
            });
        }

        // 4. Alerts and Admin Panel
        let alertTimeout;
        let lastMsg = "";

        function showSmartAlert(msg) {
            const toast = document.getElementById('smartToast');
            document.getElementById('smartToastMsg').innerText = msg;
            toast.classList.add('show');
            clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => { toast.classList.remove('show'); }, 8000); 
        }

        function listenForLiveAlerts() {
            if(!database) return;
            database.ref('admin_message').on('value', function(snap) {
                const msg = snap.val();
                if(msg && msg.trim() !== "" && msg !== lastMsg) { 
                    lastMsg = msg; 
                    showSmartAlert(msg); 
                }
            });
        }

        let tapCount = 0, tapTimer;
        window.handleSecretTap = function() {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
            if (tapCount >= 5) { 
                openAdminDash(); 
                tapCount = 0; 
            }
        };

        function openAdminDash() {
            if(!database) { alert('لا يمكن الاتصال!'); return; }
            const dash = document.getElementById('adminDashboard');
            dash.style.display = 'flex';
            setTimeout(() => dash.style.opacity = '1', 10);
            adminListener = database.ref('active_visitors').on('value', function(snapshot) {
                document.getElementById('onlineCounter').innerText = snapshot.numChildren() || 0;
            });
        }

        window.closeAdminDash = function() {
            const dash = document.getElementById('adminDashboard');
            dash.style.opacity = '0';
            setTimeout(() => dash.style.display = 'none', 300);
            if(adminListener) database.ref('active_visitors').off('value', adminListener);
        };

        window.switchTab = function(tab) {
            document.getElementById('tabExamsBtn').classList.remove('active');
            document.getElementById('tabPdfsBtn').classList.remove('active');
            document.getElementById('dynamicExamsList').style.display = 'none';
            document.getElementById('dynamicPdfsList').style.display = 'none';
            
            if (tab === 'exams') {
                document.getElementById('tabExamsBtn').classList.add('active'); 
                document.getElementById('dynamicExamsList').style.display = 'flex';
            } else {
                document.getElementById('tabPdfsBtn').classList.add('active'); 
                document.getElementById('dynamicPdfsList').style.display = 'flex';
            }
        };

        // 5. Authentication Flow
        document.addEventListener("DOMContentLoaded", function() {
            const savedUser = localStorage.getItem('saved_username_v2');
            const savedPass = localStorage.getItem('saved_password_v2');
            if(savedUser && savedPass) {
                const uInput = document.getElementById('username'); 
                const pInput = document.getElementById('password');
                if(uInput) uInput.value = savedUser; 
                if(pInput) pInput.value = savedPass;
            }

            const isAuth = sessionStorage.getItem('student_auth') === 'verified';
            const loginTime = sessionStorage.getItem('login_time');
            
            if (isAuth && loginTime) {
                const timePassed = Date.now() - parseInt(loginTime);
                if (timePassed < 30 * 60 * 1000) {
                    
                    const sName = sessionStorage.getItem('student_name');
                    const localToken = sessionStorage.getItem('session_token');
                    if (sName && localToken && database) {
                        const sessionRef = database.ref('active_tickets/sessions/' + sName);
                        sessionRef.set(localToken).then(() => {
                            sessionRef.onDisconnect().remove();
                            monitorSession(sName);
                        }).catch(e=>{});
                    }

                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('headerSubtitle').style.display = 'none';
                    document.getElementById('examsSection').style.display = 'block';
                    fetchExamsFromServer(); 
                    fetchPdfsFromServer(); 
                    listenForLiveAlerts();
                    logoutTimer = setTimeout(() => { 
                        alert("انتهت الجلسة."); 
                        window.handleLogout(); 
                    }, (30 * 60 * 1000) - timePassed);
                } else { 
                    window.handleLogout(); 
                }
            }
        });

        window.generateAccount = function() {
            const btn = document.getElementById('genBtn');
            if(localStorage.getItem('account_generated_v2') === 'true') { 
                alert("⚠️ لديك حساب بالفعل!"); 
                return; 
            }
            
            btn.disabled = true; 
            btn.innerHTML = 'جاري الإنشاء... ⏳';
            
            const username = 'stu' + Math.floor(1000 + Math.random() * 9000);
            let password = ''; 
            const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
            for (let i = 0; i < 4; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            if (!database) { 
                alert("مشكلة اتصال!"); 
                btn.disabled = false; 
                btn.innerHTML = 'إنشاء حساب جديد'; 
                return; 
            }

            database.ref('credentials/' + username).set({ password: password }).then(() => {
                localStorage.setItem('account_generated_v2', 'true'); 
                localStorage.setItem('saved_username_v2', username); 
                localStorage.setItem('saved_password_v2', password);
                try {
                    const tempInput = document.createElement("textarea"); 
                    tempInput.value = `اسم: ${username}\nمرور: ${password}`;
                    document.body.appendChild(tempInput); 
                    tempInput.select(); 
                    document.execCommand("copy"); 
                    document.body.removeChild(tempInput);
                    alert(`✅ تم إنشاء الحساب ونسخ البيانات!\n\n👤 اسم: ${username}\n🔑 مرور: ${password}`);
                } catch(e) { 
                    alert(`✅ تم!\n👤 اسم: ${username}\n🔑 مرور: ${password}`); 
                }
                document.getElementById('username').value = username; 
                document.getElementById('password').value = password;
                btn.disabled = false; 
                btn.innerHTML = 'إنشاء حساب جديد';
            }).catch(() => { 
                alert("فشل الإنشاء."); 
                btn.disabled = false; 
                btn.innerHTML = 'إنشاء حساب جديد'; 
            });
        };

        async function verifyConnectionAndLogin(username) {
            const btn = document.getElementById('loginBtn'); 
            btn.innerHTML = 'جاري الفحص... 🛡️';
            
            // 🛠️ التحديث الجديد: استخدام User-Agent Client Hints للحصول على الموديل الدقيق 
            let deviceStr = "جهاز غير معروف";
            let osStr = "";
            let browserStr = "";
            let screenRes = window.screen.width + "x" + window.screen.height;

            try { 
                // 1. تقنية User-Agent Client Hints (دقيقة جداً للأندرويد الحديث)
                if (navigator.userAgentData) {
                    let isMobile = navigator.userAgentData.mobile;
                    try {
                        const highEntropyData = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
                        if (highEntropyData.model) deviceStr = highEntropyData.model;
                        else if (isMobile) deviceStr = "هاتف محمول";
                        
                        if (highEntropyData.platform) osStr = highEntropyData.platform + (highEntropyData.platformVersion ? " " + highEntropyData.platformVersion : "");
                    } catch(e) {}
                }
                
                // 2. استخدام مكتبة UAParser كبديل (للآيفون والكمبيوتر والموبايلات القديمة)
                const parser = new UAParser(); 
                const res = parser.getResult(); 
                const ua = navigator.userAgent;

                if (deviceStr === "جهاز غير معروف" || deviceStr === "هاتف محمول") {
                    if (res.device.vendor && res.device.model) {
                        deviceStr = res.device.vendor + " " + res.device.model;
                    } else if (res.device.model) {
                        deviceStr = res.device.model;
                    } else {
                        // استخراج متقدم من متصفحات الأندرويد اللي بتخبي اسمها
                        if (/iPhone/i.test(ua)) deviceStr = "Apple iPhone";
                        else if (/iPad/i.test(ua)) deviceStr = "Apple iPad";
                        else if (/Android/i.test(ua)) {
                            let match = ua.match(/Android\s+[0-9\.]+(?:-[a-zA-Z0-9]+)?;\s+([^;)]+)\)/);
                            if (match && match[1] && !match[1].includes("wv") && match[1].length < 30) {
                                deviceStr = match[1].trim();
                            } else deviceStr = "هاتف أندرويد";
                        }
                        else if (/Mac/i.test(ua)) deviceStr = "كمبيوتر Mac";
                        else if (/Win/i.test(ua)) deviceStr = "كمبيوتر Windows";
                    }
                }

                if (!osStr) {
                    if (res.os.name) osStr = res.os.name + (res.os.version ? " " + res.os.version : "");
                    else osStr = navigator.platform;
                }

                if (res.browser.name) {
                    browserStr = res.browser.name + (res.browser.version ? " " + res.browser.version : "");
                }

                // تنظيف الأسماء (منع ظهور Linux armv81 بدل الأندرويد)
                if (osStr.includes("Linux") || osStr.includes("armv81")) {
                    let v = ua.match(/Android\s+([0-9\.]+)/);
                    if (v) osStr = "Android " + v[1];
                }

            } catch(e) {}

            const finalOsBrowser = `${osStr || 'نظام غير معروف'} | ${browserStr || 'متصفح غير معروف'}`;

            let loc = "غير معروف", isp = "غير معروف", ip = "غير معروف", isVpn = false, isOutside = false, isVerified = false;
            
            try { 
                let cfRes = await fetch('https://1.1.1.1/cdn-cgi/trace'); 
                let cfText = await cfRes.text(); 
                let cfIp = cfText.match(/ip=([^\n]+)/); 
                if (cfIp) ip = cfIp[1]; 
            } catch(e) {}

            try {
                let r1 = await fetch('https://ipwho.is/' + (ip !== "غير معروف" ? ip : ''));
                let d1 = await r1.json();
                if (d1.success) {
                    loc = (d1.city ? d1.city + ", " : "") + d1.country;
                    isp = d1.connection.isp || "غير معروف";
                    if (d1.security.vpn || d1.security.tor) isVpn = true; 
                    if (d1.country_code !== "EG") isOutside = true;
                    isVerified = true;
                }
            } catch(e) {}

            if (!isVerified || loc === "غير معروف" || !loc.includes("Egypt")) {
                try {
                    let r2 = await fetch('https://ipapi.co/' + (ip !== "غير معروف" ? ip + '/' : '') + 'json/');
                    let d2 = await r2.json();
                    if (!d2.error && d2.city) {
                        loc = d2.city + ", " + d2.country_name;
                        isp = d2.org || isp;
                        if (d2.country_code !== "EG") isOutside = true;
                        isVerified = true;
                    }
                } catch(e) {}
            }

            if (!isVerified || loc === "غير معروف") {
                try {
                    let r3 = await fetch('https://get.geojs.io/v1/ip/geo.json' + (ip !== "غير معروف" ? '?ip=' + ip : ''));
                    let d3 = await r3.json();
                    if (d3 && d3.country) {
                        loc = (d3.city ? d3.city + ", " : "") + d3.country;
                        isp = d3.organization_name || isp;
                        if (d3.country_code !== "EG") isOutside = true;
                        isVerified = true;
                    }
                } catch(e) {}
            }

            if (!isVerified) {
                try { 
                    let cf = await fetch('https://1.1.1.1/cdn-cgi/trace'); 
                    let txt = await cf.text(); 
                    let cLoc = (txt.match(/loc=([^\n]+)/) || [])[1];
                    if (cLoc) {
                        if (cLoc === "EG") { loc = "مصر 🇪🇬"; isVerified = true; }
                        else { loc = cLoc; isOutside = true; }
                    }
                } catch(e) {}
            }
            
            let bannedList = ['41.235.55.32'];
            if(database) { 
                try { 
                    let bSnap = await database.ref('banned_ips').once('value'); 
                    if (bSnap.exists()) bannedList = bannedList.concat(Object.values(bSnap.val())); 
                } catch(e) {} 
            }

            const sendTg = (txt) => fetch(getTeleUrl(), { 
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: tgKeys.cid, text: txt }) 
            }).catch(e=>{});

            const timeNow = new Date().toLocaleString('ar-EG');

            if (bannedList.includes(ip)) { 
                showError(btn,'تم حظر جهازك من المنصة 🚫'); 
                sendTg(`🛑 محاولة دخول من IP محظور!\n👤 الاسم: ${username}\n📱 الجهاز: ${deviceStr}\n🔗 الآي بي: ${ip}\n⏰ الوقت: ${timeNow}`); 
                btn.disabled = false; 
                return; 
            }
            
            if (isVpn || isOutside || !isVerified) { 
                showError(btn, 'يرجى إغلاق الـ VPN للدخول! 🚫'); 
                let blockReason = isVpn ? "VPN مستخدم" : (isOutside ? "الآي بي خارج مصر" : "فشل التحقق من الشبكة");
                sendTg(`⚠️ محاولة دخول محظورة!\nالسبب: ${blockReason}\n👤 الاسم: ${username}\n📱 الجهاز: ${deviceStr}\n📍 الموقع: ${loc}\n📡 مزود الخدمة: ${isp}\n🔗 الآي بي: ${ip}\n⏰ الوقت: ${timeNow}`); 
                btn.disabled = false; 
                return; 
            }

            const successMsg = `🟢 طالب سجل دخول!\n👤 الاسم: ${username}\n📱 الجهاز: ${deviceStr}\n🖥 نظام التشغيل: ${finalOsBrowser}\n📍 الموقع: ${loc}\n🔗 الآي بي: ${ip}\n⏰ الوقت: ${timeNow}`;

            if(database) {
                database.ref('login_logs').push({ 
                    username: username, device: deviceStr, platform: finalOsBrowser, screen: screenRes, location: loc, isp: isp, ip: ip, time: timeNow 
                }).catch(e=>{});
            } 
            
            sendTg(successMsg);
            finalizeLogin(username);
        }

        window.handleLogin = function() {
            const btn = document.getElementById('loginBtn');
            const lastClick = localStorage.getItem('last_login_attempt_time');
            
            if (lastClick && (Date.now() - parseInt(lastClick) < 15000)) { 
                showError(btn, `انتظر ${Math.ceil((15000 - (Date.now() - parseInt(lastClick))) / 1000)} ثانية ⏳`); 
                return; 
            }
            
            if (btn.disabled) return; 
            btn.disabled = true; 
            
            if (!database) { 
                showError(btn, "مشكلة اتصال!"); 
                return; 
            }

            const uVal = document.getElementById('username').value.trim();
            const pVal = document.getElementById('password').value.trim();
            
            if(uVal === '' || pVal === '') { 
                showError(btn, 'أدخل البيانات!'); 
                return; 
            }

            localStorage.setItem('last_login_attempt_time', Date.now());
            btn.style.background = 'rgba(26,43,85,.8)'; 
            btn.innerHTML = 'جاري التحقق...';

            database.ref('credentials/' + uVal).once('value').then((snapshot) => {
                const userData = snapshot.val();
                if (userData && String(userData.password) === pVal) {
                    localStorage.setItem('saved_username_v2', uVal); 
                    localStorage.setItem('saved_password_v2', pVal);
                    verifyConnectionAndLogin(uVal);
                } else { 
                    showError(btn, 'خطأ بالبيانات!'); 
                }
            }).catch(() => { 
                showError(btn, 'فشل الاتصال!'); 
            });
        };

        function finalizeLogin(uVal) {
            const btn = document.getElementById('loginBtn');
            btn.style.background = 'rgba(34,197,94,.8)'; 
            btn.innerHTML = 'تم بنجاح ✓'; 
            btn.disabled = false; 
            
            const sessionToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
            sessionStorage.setItem('session_token', sessionToken);
            
            if(database) {
                const sessionRef = database.ref('active_tickets/sessions/' + uVal);
                sessionRef.set(sessionToken).then(() => {
                    sessionRef.onDisconnect().remove(); 
                    monitorSession(uVal);
                }).catch(e=>{});
            }

            sessionStorage.setItem('student_auth', 'verified'); 
            sessionStorage.setItem('student_name', uVal); 
            sessionStorage.setItem('login_time', Date.now()); 
            history.pushState({page: 'exams'}, 'Exams', '#exams');
            
            clearTimeout(logoutTimer); 
            logoutTimer = setTimeout(() => { 
                alert("انتهت الجلسة."); 
                window.handleLogout(); 
            }, 30 * 60 * 1000);
            
            setTimeout(() => { 
                document.getElementById('loginSection').style.display = 'none'; 
                document.getElementById('headerSubtitle').style.display = 'none'; 
                document.getElementById('examsSection').style.display = 'block'; 
                fetchExamsFromServer(); 
                fetchPdfsFromServer(); 
            }, 500);
        }

        // 6. Data Fetching
        function fetchExamsFromServer() {
            const cont = document.getElementById('dynamicExamsList');
            if (!database) { cont.innerHTML = '<p>مشكلة اتصال.</p>'; return; }
            
            database.ref('exams').on('value', function(snap) {
                cont.innerHTML = ''; 
                const data = snap.val();
                if (data) {
                    Object.values(data).forEach((exam) => {
                        if(exam && exam.name) {
                            const isC = exam.status === 'closed';
                            const aClass = isC ? 'locked' : '';
                            const aText = isC ? 'مغلق 🔒' : 'دخول';
                            cont.innerHTML += `<div class="exam-item" onclick="goToExam('${isC}', '${exam.url}')"><div class="exam-info"><span class="exam-name">${exam.name}</span><span class="exam-meta">${exam.questionsCount} سؤال</span></div><div class="exam-status ${aClass}">${aText}</div></div>`;
                        }
                    });
                } else { 
                    cont.innerHTML = '<p style="color:var(--muted); text-align:center;">لا توجد اختبارات.</p>'; 
                }
            });
        }

        function fetchPdfsFromServer() {
            const cont = document.getElementById('dynamicPdfsList');
            if (!database) return;
            
            database.ref('pdfs').on('value', function(snap) {
                cont.innerHTML = ''; 
                const data = snap.val();
                if (data) {
                    Object.values(data).forEach((pdf) => {
                        if(pdf && pdf.name) {
                            cont.innerHTML += `<div class="exam-item" onclick="openPdfModal('${pdf.url}')"><div class="exam-info"><span class="exam-name">${pdf.name}</span><span class="exam-meta">${pdf.size || 'ملف قابل للقراءة '}</span></div><div class="pdf-status">فتح 📖</div></div>`;
                        }
                    });
                }
            });
        }

        window.openPdfModal = function(url) {
            let fUrl = url;
            if (url.includes('drive.google.com')) {
                fUrl = url.replace(/\/(view|edit).*/, '/preview');
            }

            const modal = document.createElement('div'); 
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(7,9,18,0.92); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(8px); opacity:0; transition: opacity 0.3s;';
            
            const closeBtn = document.createElement('button'); 
            closeBtn.innerHTML = 'إغلاق ❌'; 
            closeBtn.style.cssText = 'margin-bottom:15px; padding:12px 25px; border-radius:12px; background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.4); font-weight:900; cursor:pointer;';
            closeBtn.onclick = () => { 
                modal.style.opacity = '0'; 
                setTimeout(() => document.body.removeChild(modal), 300); 
            };
            
            const iframe = document.createElement('iframe'); 
            iframe.src = fUrl; 
            iframe.setAttribute('allow', 'autoplay');
            iframe.style.cssText = 'width:100%; max-width:600px; height:80%; border:1px solid rgba(110,231,255,0.3); border-radius:16px; background:#fff;';
            
            modal.appendChild(closeBtn); 
            modal.appendChild(iframe); 
            document.body.appendChild(modal); 
            setTimeout(() => modal.style.opacity = '1', 10);
        };

        window.goToExam = function(isClosed, url) {
            if (isClosed === 'true' || isClosed === true) { 
                alert('مغلق 🔒'); 
            } else {
                if (!database) return;
                const sName = sessionStorage.getItem('student_name');
                if (!sessionStorage.getItem('student_auth') || !sName) { 
                    window.handleLogout(); 
                    return; 
                }
                showSmartAlert('Loading Exam ⏳');
                const token = Math.random().toString(36).substring(2) + Date.now().toString(36);
                database.ref('active_tickets/' + sName).set({ token: token, timestamp: Date.now() }).then(() => {
                    window.location.href = `${url}${url.includes('?') ? '&' : '?'}u=${encodeURIComponent(sName)}&t=${token}`; 
                });
            }
        };

        function showError(btn, msg) {
            btn.style.background = 'rgba(239,68,68,.8)'; 
            btn.innerHTML = msg;
            setTimeout(() => { 
                btn.style.background = ''; 
                btn.innerHTML = 'تسجيل الدخول'; 
                btn.disabled = false; 
            }, 2500);
        }

        window.handleLogout = function() {
            const sName = sessionStorage.getItem('student_name');
            if (sName && database && !window.isKickedOut) {
                database.ref('active_tickets/sessions/' + sName).remove().catch(e=>{});
            }
            window.isKickedOut = false;

            if (window.sessionListenerRef && window.sessionListenerCallback) {
                window.sessionListenerRef.off('value', window.sessionListenerCallback);
                window.sessionListenerRef = null;
                window.sessionListenerCallback = null;
            }

            sessionStorage.clear(); 
            clearTimeout(logoutTimer); 
            document.getElementById('username').value = localStorage.getItem('saved_username_v2') || ''; 
            document.getElementById('password').value = localStorage.getItem('saved_password_v2') || '';
            const btn = document.getElementById('loginBtn'); 
            btn.style.background = ''; 
            btn.innerHTML = 'تسجيل الدخول'; 
            btn.disabled = false; 
            
            document.getElementById('examsSection').style.display = 'none'; 
            document.getElementById('headerSubtitle').style.display = 'block'; 
            document.getElementById('loginSection').style.display = 'block';
            
            window.switchTab('exams'); 
            if (location.hash === '#exams') history.back();
        };

        window.addEventListener('popstate', function() { 
            if (document.getElementById('examsSection').style.display === 'block') { 
                if(sessionStorage.getItem('student_auth')) {
                    history.pushState({page:'exams'},'Exams','#exams'); 
                } else {
                    window.handleLogout(); 
                }
            } 
        });
        
        window.addEventListener('pageshow', function(e) { 
            if (e.persisted) { 
                const lt = sessionStorage.getItem('login_time'); 
                if (lt && (Date.now() - parseInt(lt) > 1800000)) window.handleLogout(); 
            } 
        });

    })();
    </script>
